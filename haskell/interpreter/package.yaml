name:                interpreter
version:             0.1.0.0
github:              "TheBlueFireFox/writing-an-interpreter"
license:             BSD3
author:              "TheBlueFireFox"
maintainer:          "TheBlueFireFox"
copyright:           "2023 TheBlueFireFox"

extra-source-files:
  - README.md
  - CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/TheBlueFireFox/writing-an-interpreter/tree/main/haskell/interpreter#readme>

language:            GHC2021

dependencies:
  - base >= 4.7 && < 5
  - unordered-containers
  - hashable
  - haskeline
  - transformers

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

executables:
  interpreter-exe:
    main:                Main.hs
    source-dirs:         app
    dependencies:
      - interpreter

tests:
  interpreter-test:
    defaults:            hspec/hspec@main
    dependencies:
      - interpreter
